services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: kb
      POSTGRES_PASSWORD: kb
      POSTGRES_DB: kb
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  # Local models. Skip this service if you install the Ollama desktop app instead (same port 11434).
  ollama:
    image: ollama/ollama
    ports: ["11434:11434"]
    volumes: ["ollama:/root/.ollama"]
    # NVIDIA GPU on Windows/Linux: uncomment
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
volumes:
  pgdata:
  ollama:
